# Workflow that lints code, runs tests, and builds the project. On pushes
# to the main branch, also creates a version and create a release on GitHub.
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: CHECKOUT
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: INSTALL - mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.7.5'

      - name: INSTALL - dependencies
        run: yarn install --immutable

      - name: COMMITLINT - PR title
        if: github.event_name == 'pull_request'
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: RELEASE - dry-run validation
        if: github.event_name == 'pull_request'
        run: yarn semantic-release --dry-run --no-ci --branches main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          - name: LINT, UNIT TEST - PR
            if: github.event_name == 'pull_request'
            run: yarn ci:pr

          - name: BUILD - PR app and Storybook
            if: github.event_name == 'pull_request'
            run: yarn ci:pr:build

          - name: INSTALL - PR Playwright browser
            if: github.event_name == 'pull_request'
            run: yarn test:e2e:install:ci

      - name: LINT, UNIT TEST
        if: github.event_name == 'push'
        run: yarn ci

      - name: INSTALL - Playwright browser
        if: github.event_name == 'push'
        run: yarn test:e2e:install

      - name: E2E TEST
        run: yarn test:e2e
        env:
          PAGES_E2E_BASE_PATH: '/template-vite-react/'
          PLAYWRIGHT_REUSE_PAGES_BUILD: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

      - name: BUILD - release app and Storybook
        if: github.ref == 'refs/heads/main'
        run: yarn run-p build build-storybook
        env:
          VITE_PUBLIC_BASE_PATH: '/template-vite-react/'
          VITE_CF_DOMAIN: 'https://aquia-inc.github.io/template-vite-react/'
          VITE_DEMO_AUTH_ENABLED: 'true'
          VITE_IDP_ENABLED: 'false'

      - name: UPLOAD - build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: dist
          path: './dist'

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test_build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-publishing
      queue: max
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: CHECKOUT
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: INSTALL - mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.7.5'

      - name: INSTALL - dependencies
        run: yarn install --immutable

      - name: DOWNLOAD - build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: './dist'

      - name: ARCHIVE - distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --mode='a=rX,u+w' \
            -cf - dist \
            | gzip -n -9 > release/template-vite-react.tar.gz

      # semantic-release will only run on pushes to main (see package.json)
      - name: RELEASE
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - name: DOWNLOAD - build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: './dist'

      - name: PREPARE - GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: CONFIGURE - GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: UPLOAD - GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: DEPLOY - GitHub Pages
        id: pages-deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
